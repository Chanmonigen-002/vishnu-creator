name: VishnuCreator Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target Desktop platforms to build and verify
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-x64
          - macos-arm64
          - windows-x64
          - publish
      release_tag:
        description: Existing release tag used only when target=publish (preserves tags and candidate packages)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.release-matrix.outputs.matrix }}
      release-tag: ${{ steps.release-target.outputs.tag }}
      release-sha: ${{ steps.release-target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Desktop release tag
        id: release-target
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$TARGET" == publish ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/heads/master ]]; then
              echo '::error::Manual promotion of an existing tag can only run from main.'
              exit 1
            fi
            release="$(node apps/desktop/scripts/release-build-input.mjs promotion-target "$RELEASE_TAG")"
            echo "tag=$(jq -r '.tag' <<< "$release")" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r '.sha' <<< "$release")" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node apps/desktop/scripts/verify-desktop-release-tag.mjs "$GITHUB_REF_NAME"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$RELEASE_TAG" ]]; then
              echo '::error::release_tag can only be used with target=publish.'
              exit 1
            fi
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify CI passed for the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release-target.outputs.sha }}
        run: |
          for sha in $(printf '%s\n' "$GITHUB_SHA" "$RELEASE_SHA" | sort -u); do
            successful_runs="$(
              gh run list \
                --workflow ci.yml \
                --commit "$sha" \
                --event push \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq 'length'
            )"
            if [[ "$successful_runs" != "1" ]]; then
              echo "::error::Commit $sha has no successful main push CI. Please wait for CI to pass before creating a release tag."
              exit 1
            fi
          done
      - name: Select Desktop build platform
        id: release-matrix
        shell: bash
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            all|publish)
              matrix='{"include":[{"name":"macos-x64","os":"macos-15-intel","platform":"darwin","arch":"x64","artifact":"vishnucreator-desktop-macos-x64"},{"name":"macos-arm64","os":"macos-15","platform":"darwin","arch":"arm64","artifact":"vishnucreator-desktop-macos-arm64"},{"name":"windows-x64","os":"windows-latest","platform":"win32","arch":"x64","artifact":"vishnucreator-desktop-windows-x64-unsigned"}]}'
              ;;
            macos-x64)
              matrix='{"include":[{"name":"macos-x64","os":"macos-15-intel","platform":"darwin","arch":"x64","artifact":"vishnucreator-desktop-macos-x64"}]}'
              ;;
            macos-arm64)
              matrix='{"include":[{"name":"macos-arm64","os":"macos-15","platform":"darwin","arch":"arm64","artifact":"vishnucreator-desktop-macos-arm64"}]}'
              ;;
            windows-x64)
              matrix='{"include":[{"name":"windows-x64","os":"windows-latest","platform":"win32","arch":"x64","artifact":"vishnucreator-desktop-windows-x64-unsigned"}]}'
              ;;
            *)
              echo "::error::Unsupported Desktop build target: $TARGET"
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'publish'
    needs: verify
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      VISHNUCREATOR_DESKTOP_CACHE_DIR: ${{ github.workspace }}/apps/desktop/.cache
      ELECTRON_CACHE: ${{ github.workspace }}/apps/desktop/.cache/electron
      VISHNUCREATOR_DESKTOP_BUILD_MANIFEST: ${{ github.workspace }}/apps/desktop/release/vishnucreator-desktop-build-manifest-${{ matrix.platform }}-${{ matrix.arch }}.json
      VISHNUCREATOR_DESKTOP_OFFICIAL_BUILD: '1'
    steps:
      - name: Verify macOS production signing credentials
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::release Environment is missing macOS signing Secret: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Verify and use macOS Command Line Tools
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          tools=/Library/Developer/CommandLineTools
          if [[ ! -d "$tools" ]]; then
            echo '::error::macOS Command Line Tools are not installed; packaging does not use full Xcode.'
            exit 1
          fi
          for tool in iconutil codesign; do
            command -v "$tool" >/dev/null
          done
          DEVELOPER_DIR="$tools" xcrun --find notarytool
          DEVELOPER_DIR="$tools" xcrun --find stapler
          echo "DEVELOPER_DIR=$tools" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/vishnuai/go.mod
          cache-dependency-path: runtime/vishnuai/go.sum
      - uses: actions/cache@v4
        with:
          path: |
            apps/desktop/.cache/electron
            apps/desktop/.cache/electron-builder
            apps/desktop/.cache/node-gyp
            apps/desktop/.cache/npm
          key: desktop-tools-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json', 'apps/desktop/packaging/daemon-runtime/pnpm-lock.yaml') }}
          restore-keys: |
            desktop-tools-${{ runner.os }}-${{ matrix.arch }}-
      - uses: actions/cache@v4
        with:
          path: apps/desktop/.cache/codex-runtime
          key: codex-runtime-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/desktop/scripts/prepare-codex-runtime.mjs', 'apps/desktop/scripts/codex-runtime-contract.mjs', 'resources/codex-runtime/**') }}
          restore-keys: |
            codex-runtime-${{ runner.os }}-${{ matrix.arch }}-
      - uses: actions/cache@v4
        with:
          path: |
            .runtime/vendor/creator-runtime/${{ matrix.platform }}-${{ matrix.arch }}
          key: creator-runtime-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/desktop/scripts/install-creator-runtime-dependencies.mjs', 'apps/desktop/scripts/creator-runtime-releases.mjs', 'apps/desktop/scripts/prepare-creator-runtime.mjs') }}
      - uses: actions/cache@v4
        with:
          path: .runtime/vendor/stickman-runtime/${{ matrix.platform }}-${{ matrix.arch }}
          key: stickman-browser-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('apps/desktop/scripts/prepare-stickman-runtime.mjs') }}
      - uses: actions/cache@v4
        with:
          path: |
            .runtime/build/vishnuai/${{ matrix.platform }}-${{ matrix.arch }}
          key: vishnuai-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-vishnuai.mjs', 'runtime/vishnuai/**') }}
      - run: pnpm install --frozen-lockfile
      - name: Generate macOS production signed installer
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set +e
          pnpm desktop:release 2>&1 | tee desktop-release.log
          release_status=${PIPESTATUS[0]}
          if (( release_status != 0 )); then
            failure_tail="$(tail -n 40 desktop-release.log)"
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            echo "::error title=macOS release failure details::$failure_tail"
            {
              echo '### macOS release failure tail'
              echo '```text'
              tail -n 80 desktop-release.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$release_status"
        env:
          GH_TOKEN: ${{ github.token }}
          VISHNUCREATOR_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
          VISHNUCREATOR_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VISHNUCREATOR_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Generate Windows unsigned installer
        if: matrix.platform == 'win32'
        run: pnpm desktop:dist
        env:
          GH_TOKEN: ${{ github.token }}
          VISHNUCREATOR_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
          VISHNUCREATOR_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
      - name: Verify packaged application
        run: pnpm --filter @vishnucreator/desktop e2e:package:smoke
      - name: Generate VishnuAI Server and CLI standalone release package
        run: pnpm vishnuai:package
        env:
          VISHNUCREATOR_VISHNUAI_TARGET_PLATFORM: ${{ matrix.platform }}
          VISHNUCREATOR_VISHNUAI_TARGET_ARCH: ${{ matrix.arch }}
      - name: Upload user release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.VISHNUCREATOR_DESKTOP_RELEASE_ASSETS }}/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload VishnuAI Server and CLI release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vishnuai-release-${{ matrix.name }}
          path: ${{ env.VISHNUCREATOR_VISHNUAI_RELEASE_ASSETS }}/*
          if-no-files-found: error
          compression-level: 0
      - name: Retain internal build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-diagnostics-${{ matrix.name }}
          path: |
            apps/desktop/release/vishnucreator-desktop-build-manifest-*.json
            apps/desktop/release/builder-debug.yml
            apps/desktop/release/builder-effective-config.yaml
            desktop-release.log
            test-results/desktop-playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  vishnuai-linux-package:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'all'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/vishnuai/go.mod
          cache-dependency-path: runtime/vishnuai/go.sum
      - name: Install release metadata dependencies
        run: pnpm install --filter @vishnucreator/daemon --frozen-lockfile --ignore-scripts
      - name: Generate Linux VishnuAI Server and CLI release package
        shell: bash
        run: |
          for arch in x64 arm64; do
            VISHNUCREATOR_VISHNUAI_TARGET_PLATFORM=linux \
            VISHNUCREATOR_VISHNUAI_TARGET_ARCH="$arch" \
              node scripts/package-vishnuai-release.mjs
          done
      - name: Upload Linux VishnuAI Server and CLI release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vishnuai-release-linux
          path: .runtime/release/vishnuai/*
          if-no-files-found: error
          compression-level: 0

  candidate-ready:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'all'
    needs:
      - package
      - vishnuai-linux-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Calculate application build input fingerprint
        id: build-input
        run: echo "digest=$(node apps/desktop/scripts/release-build-input.mjs digest)" >> "$GITHUB_OUTPUT"
      - name: Record promotable candidate package
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_BUILD_INPUT_DIGEST: ${{ steps.build-input.outputs.digest }}
        run: |
          node <<'NODE'
            const fs = require("node:fs");
            const candidate = {
              schemaVersion: 2,
              commit: process.env.CANDIDATE_SHA,
              buildInputDigest: process.env.CANDIDATE_BUILD_INPUT_DIGEST,
              runId: Number(process.env.CANDIDATE_RUN_ID),
              repository: process.env.CANDIDATE_REPOSITORY,
              event: "workflow_dispatch",
              target: "all"
            };
            fs.writeFileSync("release-candidate.json", `${JSON.stringify(candidate, null, 2)}\n`);
          NODE
      - name: Upload candidate package credentials
        uses: actions/upload-artifact@v4
        with:
          name: vishnucreator-release-candidate-${{ steps.build-input.outputs.digest }}
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 90

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'publish')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.release-tag }}
      RELEASE_SHA: ${{ needs.verify.outputs.release-sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install release metadata parsing dependencies
        run: pnpm install --filter @vishnucreator/daemon --frozen-lockfile --ignore-scripts
      - name: Calculate application build input fingerprint
        id: build-input
        run: echo "digest=$(node apps/desktop/scripts/release-build-input.mjs digest)" >> "$GITHUB_OUTPUT"
      - name: Find reusable complete candidate build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_NAME: vishnucreator-release-candidate-${{ steps.build-input.outputs.digest }}
        shell: bash
        run: |
          candidate_run_id="$(
            gh api --method GET "repos/$GH_REPO/actions/artifacts" \
              -f name="$CANDIDATE_NAME" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [[ -z "$candidate_run_id" ]]; then
            echo "::error::No reusable complete candidate build for current tag. When application build inputs change, please run target=all from main first."
            exit 1
          fi

          run="$(gh api "repos/$GH_REPO/actions/runs/$candidate_run_id")"
          candidate_sha="$(jq -r '.head_sha' <<< "$run")"
          comparison_status="$(
            gh api "repos/$GH_REPO/compare/$candidate_sha...$RELEASE_SHA" --jq '.status'
          )"
          if [[ "$(jq -r '.event' <<< "$run")" != "workflow_dispatch" \
            || ( "$(jq -r '.head_branch' <<< "$run")" != "main" && "$(jq -r '.head_branch' <<< "$run")" != "master" ) \
            || "$(jq -r '.conclusion' <<< "$run")" != "success" \
            || "$(jq -r '.path' <<< "$run")" != ".github/workflows/desktop-release.yml" \
            || ( "$comparison_status" != "identical" && "$comparison_status" != "ahead" ) ]]; then
            echo "::error::Candidate build $candidate_run_id source or ancestor relationship is invalid."
            exit 1
          fi
          {
            echo "run-id=$candidate_run_id"
            echo "sha=$candidate_sha"
            echo "name=$CANDIDATE_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Using verified candidate build: $candidate_run_id ($candidate_sha)"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          path: artifacts
          pattern: vishnucreator-desktop-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          path: artifacts
          pattern: vishnuai-release-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          name: ${{ steps.candidate.outputs.name }}
          path: candidate
      - name: Verify candidate package credentials
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          EXPECTED_RUN_ID: ${{ steps.candidate.outputs.run-id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_BUILD_INPUT_DIGEST: ${{ steps.build-input.outputs.digest }}
        run: |
          node <<'NODE'
            const fs = require("node:fs");
            const candidate = JSON.parse(fs.readFileSync("candidate/release-candidate.json", "utf8"));
            const valid = candidate.schemaVersion === 2
              && candidate.commit === process.env.EXPECTED_SHA
              && candidate.buildInputDigest === process.env.EXPECTED_BUILD_INPUT_DIGEST
              && String(candidate.runId) === process.env.EXPECTED_RUN_ID
              && candidate.repository === process.env.EXPECTED_REPOSITORY
              && candidate.event === "workflow_dispatch"
              && candidate.target === "all";
            if (!valid) throw new Error("Release candidate provenance does not match this tag");
          NODE
      - name: Verify release artifacts and generate download instructions
        env:
          GH_REPO: ${{ github.repository }}
        run: node apps/desktop/scripts/release-assets.mjs artifacts "$TAG" "$GH_REPO" release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROMOTION_ONLY: ${{ inputs.target == 'publish' }}
        run: |
          if [[ "$PROMOTION_ONLY" == true ]]; then
            gh api "repos/$GH_REPO/releases/tags/$TAG" > published-release.json
            node --input-type=module <<'NODE'
              import { readFileSync } from 'node:fs';
              import { verifyPublishedPayloads } from './apps/desktop/scripts/release-assets.mjs';
              const { assets } = JSON.parse(readFileSync('published-release.json', 'utf8'));
              verifyPublishedPayloads({ directory: 'artifacts', assets });
          NODE
            gh release upload "$TAG" artifacts/latest*.yml artifacts/SHA256SUMS.txt --clobber
          else
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --draft --title "VishnuCreator $TAG" --notes-file release-notes.md
            find artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          fi
          gh release edit "$TAG" --draft=false --latest --title "VishnuCreator $TAG" --notes-file release-notes.md
